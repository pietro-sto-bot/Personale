<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Codex Petri</title>
    <script>
      // SPA redirect trick for GitHub Pages
      // Encodes the full path into the query string so index.html can decode it
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 2).join('/') +
        '/?p=' + l.pathname.slice(1).split('/').slice(1).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
